name: mirror slot

# Copy slot's art set (art.slot-cfw.fyi) into this one with tools/mirror_slot.py, commit what it
# added and publish it. slot's host doesn't let Cart Studio+ read it from another origin; a copy here
# can be read. Art already in this set wins. Runs when the mirror itself changes, once a week to pick
# up slot's new art, and by hand.
on:
  push:
    branches: [main]
    paths:
      - tools/mirror_slot.py
      - .github/workflows/mirror-slot.yml
  schedule:
    - cron: '17 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# The harvest commits to main too, so the two never run at once.
concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'nelynes/slotPlus-art'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: python -m pip install --quiet Pillow

      - name: Test the mirror
        run: python -m unittest tools/test_mirror_slot.py

      - name: Mirror
        run: python tools/mirror_slot.py

      # A first copy is some 14,000 images, too much for one push, so the images go up a
      # thousand at a time and the index, which names them, last.
      - name: Commit what was added
        id: commit
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          push() {
            for attempt in 1 2 3; do
              if out=$(git push 2>&1); then return 0; fi
              echo "::warning::push $attempt failed: $(printf '%s' "$out" | tail -n 4 | tr '\n' ' ')"
              sleep 15
            done
            echo "::error::could not push to main"
            return 1
          }
          git ls-files --others --exclude-standard -- '*.png' > "$RUNNER_TEMP/new.txt"
          added=$(wc -l < "$RUNNER_TEMP/new.txt")
          split -l 1000 "$RUNNER_TEMP/new.txt" "$RUNNER_TEMP/batch."
          for batch in "$RUNNER_TEMP"/batch.*; do
            [ -s "$batch" ] || continue
            xargs -a "$batch" -d '\n' git add --
            git commit -q -m "Mirror slot's art set: $(wc -l < "$batch") images"
            push
          done
          git add -A
          if git diff --cached --quiet && [ "$added" -eq 0 ]; then
            echo "Nothing new."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git diff --cached --quiet; then
            git commit -q -m "Mirror slot's art set: index, $added images"
            push
          fi
          echo "::notice::$added images committed"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push made with this workflow's own token starts no other workflow, so publish by hand.
      - name: Publish
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
